<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="50%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DCEEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#93C5FD" stroke-width="2"/>

  <!-- Logo Badge -->
  <rect x="100" y="100" width="80" height="80" rx="20" fill="url(#accent)"/>
  <text x="140" y="152" font-family="'Poppins', 'Inter', sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SS</text>

  <!-- Name & Title -->
  <text x="210" y="138" font-family="'Poppins', sans-serif" font-size="28" font-weight="bold" fill="#1E293B">Sanjanaa S</text>
  <text x="210" y="168" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#3B82F6">Chennai Institute of Technology • Computer Science &amp; Engineering</text>

  <!-- Main Pitch -->
  <text x="100" y="270" font-family="'Poppins', sans-serif" font-size="46" font-weight="800" fill="#1E293B">Full-Stack Developer &amp; Problem Solver</text>
  <text x="100" y="325" font-family="'Inter', sans-serif" font-size="24" fill="#475569">MERN Stack • Python • 400+ LeetCode Solved • CGPA 8.8</text>

  <!-- Metric Pills -->
  <g transform="translate(100, 390)">
    <rect width="210" height="90" rx="16" fill="#FFFFFF" stroke="#DCEEFF" stroke-width="1.5"/>
    <text x="105" y="42" font-family="'Poppins', sans-serif" font-size="26" font-weight="bold" fill="#2563EB" text-anchor="middle">8.8 CGPA</text>
    <text x="105" y="68" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">CIT Chennai</text>
  </g>

  <g transform="translate(340, 390)">
    <rect width="220" height="90" rx="16" fill="#FFFFFF" stroke="#DCEEFF" stroke-width="1.5"/>
    <text x="110" y="42" font-family="'Poppins', sans-serif" font-size="26" font-weight="bold" fill="#2563EB" text-anchor="middle">400+ Solved</text>
    <text x="110" y="68" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">LeetCode Algorithms</text>
  </g>

  <g transform="translate(590, 390)">
    <rect width="210" height="90" rx="16" fill="#FFFFFF" stroke="#DCEEFF" stroke-width="1.5"/>
    <text x="105" y="42" font-family="'Poppins', sans-serif" font-size="26" font-weight="bold" fill="#2563EB" text-anchor="middle">2 Internships</text>
    <text x="105" y="68" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Dnyx &amp; EduSkills</text>
  </g>

  <g transform="translate(830, 390)">
    <rect width="270" height="90" rx="16" fill="#FFFFFF" stroke="#DCEEFF" stroke-width="1.5"/>
    <text x="135" y="42" font-family="'Poppins', sans-serif" font-size="26" font-weight="bold" fill="#2563EB" text-anchor="middle">MERN &amp; Java AI</text>
    <text x="135" y="68" font-family="'Inter', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Featured Projects</text>
  </g>
</svg>

